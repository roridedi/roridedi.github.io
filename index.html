<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R. Oridedi</title>
  <meta name="description" content="R. Oridedi — builder and entrepreneur.">
  <style>
    :root { --bg: #faf8f5; --text: #1c1917; --muted: #6b645d; --line: #e7e2db; --accent: #b4532a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141210; --text: #f1ece6; --muted: #a39b92; --line: #2e2a26; --accent: #e8935f; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: var(--bg);
      color: var(--text);
      font: 18px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 520px; }
    img {
      width: 96px; height: 96px;
      border-radius: 50%;
      border: 1px solid var(--line);
      object-fit: cover;
    }
    h1 {
      margin: 20px 0 4px;
      font: 600 clamp(34px, 8vw, 44px)/1.1 ui-serif, Georgia, "Times New Roman", serif;
    }
    .tagline { margin: 0 0 24px; color: var(--muted); }
    p { margin: 0 0 16px; }
    a { color: var(--accent); text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <img src="https://avatars.githubusercontent.com/u/2990625?v=4" alt="R. Oridedi" width="96" height="96">
    <h1>R. Oridedi</h1>
    <p class="tagline">Builder and entrepreneur</p>
    <p>I'm focused on building businesses with real moats: ones that are hard to copy and deliver deep, lasting value to the people they serve.</p>
    <p>I care about doing the research, finding a clear path to market, and then getting to work.</p>
    <p>Find me on <a href="https://github.com/roridedi">GitHub</a>.</p>
  </main>
</body>
</html>
